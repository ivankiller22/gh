<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Extraordinaria</title>
    <style>
        body {
            background-image: url("img/texturapapel.jpg");
        }
        p {
            font-size: 16px;
        }
        div {
            border: 2px solid blue;
        }
        h1 {
            color: blue;
        }
        h2 {
            color: green;
            background-color: white;
        }
    </style>
</head>
<body>

    <h1>Este es mi examen</h1>

    <p><a href="https://www.vedoque.com">Esta es una buena página</a></p>

    <figure>
        <img src="img/paisaje.jpg" alt="Paisaje" height="100">
        <figcaption>Esta es una gran imagen.</figcaption>
    </figure>

    <h2>El examen está siendo fácil</h2>

    <p>No esperaba que fuera tan fácil</p>

    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>8</td>
        </tr>
        <tr>
            <td>Lucía</td>
            <td>9</td>
        </tr>
        <tr>
            <td>Alejandro</td>
            <td>7</td>
        </tr>
    </table>

    <br>

    <div>
        <form action="#" method="post">
            Nombre: <input type="text" name="nombre"><br><br>

            Ciclo:
            <select name="ciclo">
                <option value="asir">ASIR</option>
                <option value="dam">DAM</option>
                <option value="daw">DAW</option>
            </select><br><br>

            Curso:<br>
            <input type="radio" name="curso" value="primero"> Primero<br>
            <input type="radio" name="curso" value="segundo"> Segundo<br><br>

            Estudios previos:<br>
            <input type="checkbox" name="estudios" value="bachillerato"> Bachillerato<br>
            <input type="checkbox" name="estudios" value="smr"> SMR<br><br>

            <input type="submit" value="Enviar">
        </form>
    </div>

    <footer>
        <p>Hoy sí que voy a aprobar.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        ul.menu > li {
            color: red;
            font-size: 20px;   
        }

        h2 + p {
            color: green;
        }

        input[type="text"] {
            border: 3px solid red;
        }
    </style>
</head>
<body>
    <ul class="menu">
        <li>Primera opción</li>
        <ul>
            <li>Primera subopción de la primera opción</li>
        </ul>
        <li>Segunda opción</li>
    </ul>

    <p>Mi primer párrafo</p>

    <h2>Esto es un encabezado de segundo nivel</h2>
    <p>Mi segundo párrafo</p>
    <p>Mi tercer párrafo</p>

    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Aquí escribe el nombre"
        ><br><br>
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" placeholder="Aquí escribe el apellido"
        ><br><br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" placeholder="Aquí escribe la edad"
        ><br><br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>

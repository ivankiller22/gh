<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrando imágenes</title>

    <style>
        img[src="img/copiaseguridad.jpg"]{
            display:block;
            margin: 20px auto;
            height: 200px;
            position: fixed;
            right: 20px;
        }
        img[src="img/nube.jpg"]{
            display:block;
            margin: 20px auto;
            height: 200px;
            position: fixed;
            left: 20px;
        }
        img[src="img/seguridad.jpg"]{
            display:block;
            margin: 20px auto;
            height: 200px;
            position: fixed;
            bottom: 20px;
            border: 20px solid black;
        }
    </style>
</head>
<body>
    <h1>Centrando imágenes</h1>
    <img src="img/copiaseguridad.jpg">
    <img src="img/nube.jpg">
    <img src="img/seguridad.jpg">
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis primeras tablas</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1>Mis primeras tablas</h1>
    <p>Mis primeras tablas</p>
    <table border="1" style="color: rgb(0, 0, 255);">
        <tr>
            <th>Posición</th>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td>Alice</td>
            <td>8.5</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>7.0</td>
        </tr>
    </table>
    <br>
    <table border="1">
        <tr>
            <td>1</td>
            <td><table border="1">
                <tr>
                    <td>1.1</td>
                    <td>1.2</td>
                    <td>1.3</td>
                </tr>
                <tr>
                    <td>2.1</td>
                    <td>2.2</td>
                    <td>2.3</td>
                </tr>
                <tr>
                    <td>3.1</td>
                    <td>3.2</td>
                    <td>3.3</td>
                </tr>
            </table></td>
        </tr>
        <tr>
            <td>2</td>
            <td>3</td>
        </tr>
    </table>
</body>
</html>
